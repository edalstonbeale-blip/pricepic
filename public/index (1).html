<style>

res.append(el("strong",{textContent:"Your listing"}),el("label",{textContent:"Item name"}),name,el("label",{textContent:"Price ($)"}),price,el("label",{textContent:"Condition"}),cond,el("label",{textContent:"Description"}),desc,el("div",{className:"row"},share),msg);res.scrollIntoView({behavior:"smooth"})}
